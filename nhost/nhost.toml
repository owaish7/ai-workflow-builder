# Minimal nhost config. On nhost Cloud the project's own settings (Auth, secrets,
# service versions) are managed in the dashboard; schema + Hasura metadata are applied
# by ../scripts/setup-db.mjs and ../scripts/setup-hasura.mjs. See ../README.md.
#
# Auth settings to set in the dashboard (Settings -> Authentication / Sign-in methods):
#   - Email+password sign-in: enabled
#   - "Require email verification": OFF (so demo users can sign in immediately)
#   - Allowed redirect URLs: http://localhost:3000 and your Vercel URL
# Project env vars to set (Settings -> Environment variables): GROQ_API_KEY

[functions]
[functions.node]
version = 22
